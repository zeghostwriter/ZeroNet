[workspace]
resolver = "2"
members = [
    "crates/zero-core",
    "crates/zero-config",
    "crates/zero-net",
    "crates/zero-dns",
    "crates/zero-router",
    "crates/zero-security",
    "crates/zero-transport",
    "crates/zero-protocol",
    "crates/zero-runtime",
    "crates/zero-evasion",
    "crates/zero-observatory",
    "crates/zero-tun",
    "crates/zray-cli",
    "crates/zray-mobile",
    "crates/zero-scanner",
    "crates/zero-discovery",
    "crates/zeronet-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MPL-2.0"
repository = "https://github.com/zray/zray-core"

[workspace.dependencies]
zero-core = { path = "crates/zero-core", version = "0.1.0" }
zero-config = { path = "crates/zero-config", version = "0.1.0" }
zero-net = { path = "crates/zero-net", version = "0.1.0" }
zero-dns = { path = "crates/zero-dns", version = "0.1.0" }
zero-router = { path = "crates/zero-router", version = "0.1.0" }
zero-security = { path = "crates/zero-security", version = "0.1.0" }
zero-transport = { path = "crates/zero-transport", version = "0.1.0" }
zero-protocol = { path = "crates/zero-protocol", version = "0.1.0" }
zero-runtime = { path = "crates/zero-runtime", version = "0.1.0" }
zero-evasion = { path = "crates/zero-evasion", version = "0.1.0" }
zero-observatory = { path = "crates/zero-observatory", version = "0.1.0" }
zero-tun = { path = "crates/zero-tun", version = "0.1.0" }
zero-scanner = { path = "crates/zero-scanner", version = "0.1.0" }
zero-discovery = { path = "crates/zero-discovery", version = "0.1.0" }
zray-cli = { path = "crates/zray-cli", version = "0.1.0" }
zray-mobile = { path = "crates/zray-mobile", version = "0.1.0" }
zeronet-tui = { path = "crates/zeronet-tui", version = "0.1.0" }

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "aws-lc-rs", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "aws-lc-rs", "std", "tls12", "logging", "brotli", "zlib"] }
rustls-pki-types = "1"
webpki-roots = "1"
bytes = "1"
blake3 = "1"
futures = "0.3"
netstack-smoltcp = "0.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1"
aho-corasick = "1"
regex = "1"
ipnet = "2"
socket2 = { version = "0.5", features = ["all"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
url = "2"
percent-encoding = "2"
httparse = "1"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
flate2 = "1"
http = "1"
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes = "0.8"
cipher = "0.4"
ctr = "0.9"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = { version = "0.3.2", features = ["getrandom"] }
ml-dsa = "0.1.1"
boringtun = { version = "0.7.1", default-features = false }
subtle = "2"
anyhow = "1"
libc = "0.2"
zstd = "0.13"
zeroize = "1"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
opt-level = 3

# Mobile libraries (crates/zray-mobile/build-android.sh). Identical to release
# except that panics unwind: the library lives inside someone else's process,
# every JNI/C entry point catches unwinds and returns an error instead, and a
# panicking tokio task then ends that one session rather than aborting the
# user's VPN. With `panic = "abort"` those guards are dead code.
[profile.release-mobile]
inherits = "release"
panic = "unwind"
# Measured on arm64: 16.5 MB -> 13.3 MB (gzipped 7.6 -> 5.7 MB). Crypto hot
# paths are hand-written assembly in ring/aws-lc and unaffected; the proxy is
# I/O bound, and download size matters more on Iranian mobile links.
opt-level = "s"

[patch.crates-io]
# The ordinary crates.io rustls API cannot control ClientHello extension order,
# GREASE, or padding. Keep the exact shaping support pinned to the same audited
# MPL-2.0 revision used by the bundled Xray reference.
rustls = { git = "https://github.com/aimalygin/shaped-rustls", rev = "3a131beaef0183b0cb61e5a9070a703b6be39ed3" }
# TUN userspace stack with local fixes for per-connection memory: duplicate
# sockets from retransmitted SYNs and orphaned connections held for two
# hours. See vendor/netstack-smoltcp/PATCHES.md.
netstack-smoltcp = { path = "vendor/netstack-smoltcp" }
