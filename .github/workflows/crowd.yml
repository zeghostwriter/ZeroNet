name: crowd

# Turns the reports apps sent to the crowd relay into rankings.json: which
# public servers and clean Cloudflare addresses work on which network. The
# file is published on the `crowd-data` branch, where apps read it from
# raw.githubusercontent.com and its jsDelivr mirror.
#
# Finds the relay deployed by the "deploy crowd relay" workflow through the
# Cloudflare API (same secrets), or uses the repository variable
# CROWD_RELAYS (comma-separated URLs) for relays hosted elsewhere. With
# neither, it does nothing.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the harvest workflow: both replace the crowd-data commit.
concurrency:
  group: crowd-data
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  rank:
    name: rank reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # First: the relay's address comes from its wrangler.toml.
      - uses: actions/checkout@v4
      - name: find the relays
        id: relays
        env:
          CONFIGURED: ${{ vars.CROWD_RELAYS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          relays="$CONFIGURED"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | jq -r '.result.subdomain // empty') || sub=""
            name=$(sed -n 's/^name = "\(.*\)"$/\1/p' deploy/crowd-relay/wrangler.toml 2>/dev/null)
            if [ -n "$sub" ] && [ -n "$name" ]; then
              relays="https://$name.$sub.workers.dev${relays:+,$relays}"
            fi
          fi
          echo "list=$relays" >> "$GITHUB_OUTPUT"
          [ -n "$relays" ] || echo "No relay set up yet; nothing to do."

      - uses: dtolnay/rust-toolchain@stable
        if: steps.relays.outputs.list != ''
      - uses: Swatinem/rust-cache@v2
        if: steps.relays.outputs.list != ''
        with:
          key: crowd
      - run: cargo build --release -p zero-discovery --bin zeronet-crowd --bin zeronet-sign
        if: steps.relays.outputs.list != ''

      - name: export reports
        if: steps.relays.outputs.list != ''
        env:
          RELAYS: ${{ steps.relays.outputs.list }}
          EXPORT_TOKEN: ${{ secrets.CROWD_EXPORT_TOKEN }}
        run: |
          since=$(( $(date +%s) - 12 * 3600 ))
          parts=()
          IFS=',' read -ra relays <<< "$RELAYS"
          for relay in "${relays[@]}"; do
            relay="${relay// /}"
            [[ "$relay" == https://* ]] || continue
            file="export-${#parts[@]}.json"
            # One relay being down must not stop the others from counting.
            if curl -fsS --retry 3 --max-time 60 \
                 -H "Authorization: Bearer $EXPORT_TOKEN" \
                 "$relay/v1/export?since=$since" -o "$file"; then
              parts+=("$file")
            else
              echo "::warning::could not export from $relay"
            fi
          done
          if [ ${#parts[@]} -eq 0 ]; then
            # Still publish: the rankings carry the relay addresses, which
            # is how apps learn where to send their first reports.
            echo "::warning::no relay answered; publishing without reports"
            echo '[]' > reports.json
          else
            jq -s 'add' "${parts[@]}" > reports.json
          fi
          echo "$(jq length reports.json) reports"

      - name: rank
        if: steps.relays.outputs.list != ''
        env:
          RELAYS: ${{ steps.relays.outputs.list }}
        run: |
          target/release/zeronet-crowd \
            --reports reports.json \
            --sources deploy/crowd/sources.json \
            --sources deploy/crowd/harvest-sources.json \
            --sources deploy/crowd/verified-source.json \
            --out rankings.json \
            --relays "$RELAYS"

      - name: publish
        if: steps.relays.outputs.list != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CROWD_SIGNING_KEY: ${{ secrets.CROWD_SIGNING_KEY }}
        run: |
          if [ -n "$CROWD_SIGNING_KEY" ]; then
            target/release/zeronet-sign sign rankings.json
          else
            echo "::warning::No CROWD_SIGNING_KEY; publishing rankings.json unsigned."
          fi
          files="rankings.json"
          [ -f rankings.json.sig ] && files="$files rankings.json.sig"
          .github/scripts/publish-crowd-data.sh $files
