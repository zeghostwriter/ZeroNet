name: deploy crowd relay

# Puts the crowd relay (deploy/crowd-relay) on Cloudflare's free
# *.workers.dev address: no domain, no wrangler on anyone's computer. Apps
# send their reports through their own tunnel, so it does not matter that
# workers.dev is filtered in Iran.
#
# Needs, in Settings → Secrets and variables → Actions:
#   secret CLOUDFLARE_API_TOKEN   a Cloudflare API token with
#                                 "Workers Scripts: Edit" and "D1: Edit"
#   secret CLOUDFLARE_ACCOUNT_ID  the account id (Cloudflare dashboard,
#                                 Workers & Pages, right-hand side)
#   secret CROWD_EXPORT_TOKEN     any long random string; the crowd workflow
#                                 uses it to read the reports
# and a workers.dev subdomain chosen once in the Cloudflare dashboard
# (Workers & Pages → the first visit asks for one).
#
# Runs by hand, and again whenever the relay's code changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["deploy/crowd-relay/**"]

permissions:
  contents: read

concurrency:
  group: crowd-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPORT_TOKEN: ${{ secrets.CROWD_EXPORT_TOKEN }}
      WRANGLER: npx --yes wrangler@4
    defaults:
      run:
        working-directory: deploy/crowd-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: check the secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$EXPORT_TOKEN" ] || missing="$missing CROWD_EXPORT_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see .github/workflows/crowd-relay.yml)"
            exit 1
          fi
      # The database is made once and found by name afterwards.
      - name: database
        run: |
          id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "zeronet-crowd") | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create zeronet-crowd
            id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name == "zeronet-crowd") | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::could not create the D1 database"; exit 1; }
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$id/" wrangler.toml
          $WRANGLER d1 execute zeronet-crowd --remote --file schema.sql
      - name: deploy
        run: $WRANGLER deploy
      - name: secrets
        run: |
          printf '%s' "$EXPORT_TOKEN" | $WRANGLER secret put EXPORT_TOKEN
          # The pseudonym key only needs to be secret and stable; derived
          # from the export token so there is one fewer secret to keep.
          printf '%s' "$EXPORT_TOKEN|pseudonyms" | sha256sum | cut -d' ' -f1 | $WRANGLER secret put SALT_SECRET
      - name: address
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          name=$(sed -n 's/^name = "\(.*\)"$/\1/p' wrangler.toml)
          url="https://$name.$sub.workers.dev"
          curl -fsS "$url/" > /dev/null && echo "Relay is up at $url" >> "$GITHUB_STEP_SUMMARY"
