name: release

# Push a tag like `v0.2.0` and every download people need lands on the
# GitHub Releases page: the desktop app for Windows and Linux, the Android
# APKs, and Zray Core, the command line engine on its own. Running it by hand
# builds the same files as workflow artifacts without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish as this tag (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  # The version the apps report and compare with the latest release for
  # their in-app updates. Empty for a build-only run, which then reports
  # the crate version and never checks.
  ZERONET_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p zeronet-tui
      - run: cargo build --release -p zray-cli
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, pkg | Out-Null
          Copy-Item target/release/zeronet-tui.exe pkg/ZeroNet.exe
          # TUN mode on Windows needs WireGuard's Wintun driver next to the
          # executable. Its prebuilt, signed DLL may be redistributed as is.
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun/wintun/bin/amd64/wintun.dll pkg/
          Copy-Item wintun/wintun/LICENSE.txt pkg/wintun-LICENSE.txt
          Compress-Archive -Path pkg/* -DestinationPath dist/ZeroNet-Windows-x64.zip
          Copy-Item target/release/zeronet-tui.exe dist/ZeroNet-Windows-x64.exe
          # Zray Core: the engine without the app.
          New-Item -ItemType Directory -Force core | Out-Null
          Copy-Item target/release/zray.exe core/
          Copy-Item LICENSE core/
          Compress-Archive -Path core/* -DestinationPath dist/ZrayCore-Windows-x64.zip
          Copy-Item target/release/zray.exe dist/ZrayCore-Windows-x64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        # `label` names the downloads. "x64" and "ARM64" rather than the
        # kernel's x86_64/aarch64: people picked the ARM file on ordinary
        # PCs and got "exec format error". The same words as the Windows
        # download, and what the in-app updater looks for (update.rs).
        include:
          - arch: x86_64
            label: x64
            runner: ubuntu-22.04
          - arch: aarch64
            label: ARM64
            runner: ubuntu-22.04-arm
    # The oldest supported runner: glibc is forward compatible only, so
    # building here keeps the binary running on older distributions.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p zeronet-tui
      - run: cargo build --release -p zray-cli
      - name: AppImage and tarball
        env:
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p dist
          app=ZeroNet.AppDir
          install -Dm755 target/release/zeronet-tui "$app/usr/bin/zeronet-tui"
          install -Dm644 packaging/linux/zeronet.desktop "$app/zeronet.desktop"
          install -Dm644 packaging/icons/zeronet.png "$app/zeronet.png"
          install -Dm644 packaging/icons/zeronet.png "$app/usr/share/icons/hicolor/512x512/apps/zeronet.png"
          ln -s usr/bin/zeronet-tui "$app/AppRun"
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool
          ./appimagetool --no-appstream "$app" "dist/ZeroNet-Linux-${LABEL}.AppImage"

          # The bare program, which a non-AppImage install updates itself
          # from.
          install -m755 target/release/zeronet-tui "dist/ZeroNet-Linux-${LABEL}"

          # The plain binary, with the desktop entry and icon, for people
          # who prefer to install it themselves. A tarball keeps the
          # executable bit that a browser download would drop.
          pkg="ZeroNet-Linux-${LABEL}"
          mkdir -p "$pkg"
          cp target/release/zeronet-tui packaging/linux/zeronet.desktop packaging/icons/zeronet.png "$pkg/"
          tar -czf "dist/$pkg.tar.gz" "$pkg"

          # Zray Core: the engine without the app, as a tarball and bare.
          core="ZrayCore-Linux-${LABEL}"
          mkdir -p "$core"
          cp target/release/zray LICENSE "$core/"
          tar -czf "dist/$core.tar.gz" "$core"
          install -m755 target/release/zray "dist/$core"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.label }}
          path: dist/*

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Its default list includes the legacy "tools" package, which the
          # SDK repository no longer carries, failing the step.
          packages: platform-tools
      # Platform and build tools are installed by the Android Gradle plugin
      # from compileSdk; the NDK version is what the Rust build is tested on.
      - name: NDK
        run: sdkmanager "ndk;29.0.14206865"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install cargo-ndk --locked
      # Optional: a real signing key from repository secrets, so installed
      # copies can be updated in place. Without it the APKs are signed with
      # a throwaway debug key.
      - name: signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        working-directory: ZeroNet-Mobile
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      # The key made by the "create Android signing key" workflow: committed
      # encrypted, opened here with the password secret.
      - name: signing key (encrypted in the repository)
        env:
          PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        if: env.HAS_KEYSTORE != 'true' && env.HAS_SIGNING_PASSWORD == 'true'
        working-directory: ZeroNet-Mobile
        run: |
          if [ ! -f signing/release.p12.enc ]; then
            echo "::error::ANDROID_SIGNING_PASSWORD is set but there is no key yet. Run the 'create Android signing key' workflow once."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/release.p12.enc -out release.p12 -pass env:PASSWORD
          {
            echo "storeFile=release.p12"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=zeronet"
            echo "keyPassword=$PASSWORD"
          } > keystore.properties
      # Without a key the APKs are signed with a throwaway one, and Android
      # will not install them over the previous release.
      - name: warn about unsigned builds
        if: env.HAS_KEYSTORE != 'true' && env.HAS_SIGNING_PASSWORD != 'true'
        run: echo "::warning::No Android signing key; these APKs cannot update an installed copy. See .github/workflows/signing-key.yml."
      - name: build APKs
        working-directory: ZeroNet-Mobile
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          version="${RELEASE_TAG#v}"
          ./gradlew --no-daemon assembleRelease ${version:+-PzeronetVersion=$version}
      - name: collect
        run: |
          mkdir -p dist
          out=ZeroNet-Mobile/app/build/outputs/apk/release
          cp "$out/app-universal-release.apk"   dist/ZeroNet-Android-universal.apk
          cp "$out/app-arm64-v8a-release.apk"   dist/ZeroNet-Android-arm64-v8a.apk
          cp "$out/app-armeabi-v7a-release.apk" dist/ZeroNet-Android-armeabi-v7a.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  publish:
    name: publish release
    # A pushed tag, or a manual run given a version: the release action then
    # creates the tag on this commit.
    if: github.ref_type == 'tag' || inputs.version != ''
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ZeroNet ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## دانلود / Download

            | | Download this | |
            |---|---|---|
            | 🪟 Windows | `ZeroNet-Windows-x64.zip` | Extract, double-click `ZeroNet.exe` |
            | 🐧 Linux, most computers (Intel / AMD) | `ZeroNet-Linux-x64.AppImage` | Make it executable, double-click |
            | 🐧 Linux on ARM (Raspberry Pi, ARM laptops) | `ZeroNet-Linux-ARM64.AppImage` | Make it executable, double-click |
            | 🤖 Android, any phone | `ZeroNet-Android-universal.apk` | Install it |

            **Zray Core** is the same engine without the app, a command-line program for servers, routers and scripts (`zray run config.json`):

            | | Download this |
            |---|---|
            | 🪟 Windows | `ZrayCore-Windows-x64.zip` |
            | 🐧 Linux, Intel / AMD | `ZrayCore-Linux-x64.tar.gz` |
            | 🐧 Linux on ARM | `ZrayCore-Linux-ARM64.tar.gz` |

            **Not sure which Linux file?** Run `uname -m` in a terminal: `x86_64` → **x64**, `aarch64` → **ARM64**. "exec format error" means the other one.
            The other files are for the in-app updater and for experts: the bare programs, `.tar.gz` archives, and smaller Android APKs for one processor type (`arm64-v8a` fits almost every modern phone).

            **نمیدونی کدوم فایل لینوکس رو بگیری؟** توی ترمینال `uname -m` رو بزن : `x86_64` یعنی **x64** و `aarch64` یعنی **ARM64** . اگه ارور «exec format error» گرفتی یعنی باید اون یکی رو بگیری . برای اندروید هم اگه مطمئن نیستی `universal` رو نصب کن .

            **زری کور** همون موتور بدون اپه ، یه برنامه ی خط فرمان برای سرور و روتر و اسکریپت (`zray run config.json`) . فایل هاش بالا توی جدول Zray Core هستن .

            راهنمای کامل فارسی توی [README](https://github.com/${{ github.repository }}#readme) هست.
