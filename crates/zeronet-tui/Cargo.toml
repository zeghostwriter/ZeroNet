[package]
name = "zeronet-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "zeronet-tui"
path = "src/main.rs"

[lib]
name = "zeronet_tui"
path = "src/lib.rs"

[dependencies]
zero-core = { workspace = true }
zero-config = { workspace = true }
zero-runtime = { workspace = true }
zero-tun = { workspace = true }
zero-scanner = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
tui-big-text = "0.7"
throbber-widgets-tui = "0.9"
tachyonfx = "0.16"
# Display width of CJK / Persian / emoji text, so truncation and wrapping
# match the columns the terminal actually uses. Same major as ratatui's.
unicode-width = "0.2"
crossterm = { version = "0.28", features = ["event-stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
socket2 = { workspace = true }
libc = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }

# QR codes, image decoding and terminal image display
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ratatui-image = { version = "8", default-features = false, features = ["crossterm"] }
arboard = { version = "3", default-features = false }
# Per-process CPU and memory for the Activity page. Only the process/system
# probes: no disks, networks, users, or the rayon thread pool.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[build-dependencies]
# Icon and version resource for the Windows executable; only runs when
# targeting Windows.
winresource = "0.1"
