[package]
name = "zero-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zero-core = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
hmac = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
hkdf = { workspace = true }
aes = { workspace = true }
cipher = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
boringtun = { workspace = true }
# User-space TCP/IP for streams through WireGuard (wg_stack); the same
# version and features the TUN stack already builds.
smoltcp = { version = "0.12", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-udp", "socket-tcp"] }
ctr = { workspace = true }
x25519-dalek = { workspace = true }
ml-kem = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "time", "test-util"] }
