name = "zeronet-crowd-relay"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Deletes reports older than two days, every hour.
[triggers]
crons = ["17 * * * *"]

# Create it with `wrangler d1 create zeronet-crowd`, paste the id it prints
# here, then load the schema: `wrangler d1 execute zeronet-crowd --remote --file schema.sql`.
[[d1_databases]]
binding = "DB"
database_name = "zeronet-crowd"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Secrets, never written here (this file is committed):
#
#   wrangler secret put SALT_SECRET    # any long random string; keys the daily reporter pseudonyms
#   wrangler secret put EXPORT_TOKEN   # the GitHub Action's password for /v1/export
